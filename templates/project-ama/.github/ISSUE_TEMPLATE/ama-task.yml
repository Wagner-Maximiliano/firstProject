name: AMA task
description: Create a task that AMA can route and execute
title: "[AMA Task] "
labels: []
body:
  - type: input
    id: summary
    attributes:
      label: Task summary
      description: One-sentence description of the work
      placeholder: Add login form validation to the account settings page
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal / outcome
      description: What should be true when this task is done?
      placeholder: Users see inline validation errors and cannot submit invalid emails.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Clear checks for done
      placeholder: |
        - invalid email shows inline error
        - submit button stays disabled until form is valid
        - tests cover the new cases
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Explicit blocked-by / depends-on issue numbers if any
      placeholder: |
        blocked-by: #123

  - type: textarea
    id: likely_scope
    attributes:
      label: Likely files or modules
      description: Optional scope hint to improve overlap detection
      placeholder: src/settings/profile.tsx, src/lib/validation.ts

  - type: dropdown
    id: owner
    attributes:
      label: AMA owner label
      options:
        - ama:owner:orchestrator
        - ama:owner:builder
        - ama:owner:reviewer
        - ama:owner:inverted-reviewer
        - ama:owner:board
        - ama:owner:human
    validations:
      required: true

  - type: dropdown
    id: tier
    attributes:
      label: AMA tier label
      options:
        - ama:tier:t1
        - ama:tier:t2
        - ama:tier:t3
        - ama:tier:board
    validations:
      required: true
