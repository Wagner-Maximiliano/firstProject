name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up environment
        run: ./scripts/setup.sh

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest

      - name: Run Ruff
        run: |
          source .venv/bin/activate
          ruff check .

      - name: Run Black check
        run: |
          source .venv/bin/activate
          black --check .

      - name: Run mypy
        run: |
          source .venv/bin/activate
          mypy core tests
